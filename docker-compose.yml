version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: siem-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siem_lite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: siem-redis-compose
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: siem-backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/siem_lite
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    container_name: siem-worker
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/siem_lite
      REDIS_URL: redis://redis:6379/0
    command: ["python", "worker.py"]
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: siem-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
